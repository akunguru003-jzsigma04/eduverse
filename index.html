<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUVERSE</title>
    <style>
        /* === BASE STYLES & CSS VARIABLES === */
        :root {
            --bg-color: #e0f2fe;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --browser-bg: #ffffff;
            --browser-border: #e2e8f0;
            --card-bg: #f8fafc;
            --color-blue: #4ba3e3;
            --color-orange: #f9a826;
            --color-purple: #a0619c;
            --color-yellow: #fbc531;
            --color-dark-blue: #1e3a8a;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --nav-bg-mobile: #ffffff;
        }

        body.dark-mode {
            --bg-color: #0f172a; --text-main: #f1f5f9; --text-muted: #94a3b8;
            --browser-bg: #1e293b; --browser-border: #334155; --card-bg: #334155;
            --color-dark-blue: #60a5fa; --nav-bg-mobile: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main); background-color: var(--bg-color); color: var(--text-main);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; transition: background-color 0.3s, color 0.3s;
        }

        .bg-decor {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: radial-gradient(circle at 15% 50%, rgba(255,255,255,0.15) 0%, transparent 50%),
                              radial-gradient(circle at 85% 30%, rgba(255,255,255,0.2) 0%, transparent 40%);
            pointer-events: none;
        }
        body.dark-mode .bg-decor { opacity: 0.05; }

        /* === HEADER === */
        header { text-align: center; margin-top: 40px; margin-bottom: 20px; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        h1 { color: var(--color-dark-blue); font-size: 2.5rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        h1:hover { transform: scale(1.05); }
        .theme-toggle { background: var(--card-bg); border: 1px solid var(--browser-border); color: var(--text-main); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.3s; }
        .theme-toggle:hover { background: var(--color-blue); color: white; }

        /* === MAIN LAYOUT === */
        .portal-wrapper { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 40px; width: 100%; max-width: 1200px; padding: 20px; position: relative; z-index: 10; }
        .orbit-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 300px; border: 2px dashed rgba(100, 116, 139, 0.4); border-radius: 50%; z-index: 0; pointer-events: none; }
        .menu-column { display: flex; flex-direction: column; gap: 60px; z-index: 10; }
        
        
        
        

        /* === MENU ITEMS === */
        .menu-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; text-align: center; width: 120px; position: relative; }
        .menu-item:hover { transform: scale(1.1) !important; }
        .circle-icon { width: 90px; height: 90px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.15); margin-bottom: 10px; position: relative; animation: float 4s ease-in-out infinite; }
        .circle-icon::after { content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px; border: 2px dashed rgba(255,255,255,0.6); border-radius: 50%; }
        .notif-dot { position: absolute; top: 0; right: 15px; width: 18px; height: 18px; background-color: #ef4444; border-radius: 50%; border: 2px solid white; z-index: 5; animation: pulse 2s infinite; display: block; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }
        
        .menu-column.left .menu-item:nth-child(1) .circle-icon { animation-delay: 0s; }
        .menu-column.left .menu-item:nth-child(2) .circle-icon { animation-delay: 1.5s; }
        .menu-column.right .menu-item:nth-child(1) .circle-icon { animation-delay: 0.7s; }
        .menu-column.right .menu-item:nth-child(2) .circle-icon { animation-delay: 2.2s; }
        .menu-text { font-weight: 700; color: var(--color-dark-blue); font-size: 0.95rem; line-height: 1.2; }
        
        .bg-mpi { background-color: var(--color-yellow); } .bg-absen { background-color: var(--color-blue); } .bg-jurnal { background-color: var(--color-purple); } .bg-nilai { background-color: var(--color-orange); }

        /* === BROWSER WINDOW === */
        .browser-window { width: 100%; max-width: 650px; background: var(--browser-bg); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; z-index: 10; display: none; flex-direction: column; min-height: 520px; border: 1px solid var(--browser-border); }
        .browser-header { background-color: #0f172a; padding: 12px 15px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; } .dot.red { background-color: #ff5f56; } .dot.yellow { background-color: #ffbd2e; } .dot.green { background-color: #27c93f; }
        .clock-widget { margin-left: auto; color: #cbd5e1; font-family: monospace; font-size: 0.9rem; font-weight: bold;}
        .browser-nav { background-color: var(--card-bg); padding: 10px 15px; border-bottom: 1px solid var(--browser-border); font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; font-family: monospace; }
        .browser-content { padding: 25px; flex-grow: 1; overflow-y: auto; background-color: var(--browser-bg); animation: slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* === CONTENT STYLES & NEW COMPONENTS === */
        .view-title { color: var(--color-dark-blue); margin-bottom: 20px; font-size: 1.5rem; border-bottom: 2px solid var(--browser-border); padding-bottom: 10px;}
        
        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--browser-border); }
        .tab-btn { padding: 10px 20px; background: none; border: none; border-bottom: 3px solid transparent; color: var(--text-muted); font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: -2px; }
        .tab-btn.active { color: var(--color-dark-blue); border-bottom-color: var(--color-blue); }
        .tab-btn:hover:not(.active) { color: var(--text-main); }
        
        /* Form & Tables */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: var(--text-main);}
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid var(--browser-border); border-radius: 6px; font-family: inherit; background: var(--browser-bg); color: var(--text-main);}
        button.btn-submit { background: var(--color-blue); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;}
        button.btn-submit:hover { background: var(--color-dark-blue); }
        button.btn-outline { background: transparent; color: var(--color-purple); border: 1px solid var(--color-purple); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        button.btn-outline:hover { background: var(--color-purple); color: white;}
        button.btn-export { background: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;}
        button.btn-export:hover { background: #059669; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; color: var(--text-main); }
        th, td { border: 1px solid var(--browser-border); padding: 8px; text-align: center; vertical-align: middle; }
        td:nth-child(2) { text-align: left; font-weight: 600; } /* Kolom Nama */
        th { background-color: var(--card-bg); color: var(--color-dark-blue); font-weight: 600; }
        td input[type="number"] { width: 60px; padding: 5px; text-align: center; border: 1px solid var(--browser-border); border-radius: 4px; background: transparent; font-weight: bold; color: var(--text-main);}
        
        /* Badges for Diferensiasi */
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; display: inline-block; margin-top: 5px; }
        .badge-visual { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .badge-auditori { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .badge-kinestetik { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-mahir { background: #e0e7ff; color: #3730a3; }
        .btn-alpa { background: #fee2e2; color: #b91c1c; border: 1px solid #f87171; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold;}
        .btn-alpa:hover { background: #ef4444; color: white;}

        /* Toast & Warning */
        .toast { position: fixed; bottom: 30px; right: 30px; background: #10b981; color: white; padding: 15px 25px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-weight: bold; transform: translateX(200%); transition: 0.4s; z-index: 9999; display: flex; align-items: center; gap: 10px; }
        .toast.show { transform: translateX(0); }
        .toast.warning { background: #ef4444; }

        /* Profile & Dashboard */
        .profile-container { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 25px; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--browser-border); }
        .profile-avatar { width: 70px; height: 70px; background: var(--color-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; text-align: center;}
        .stat-box { background: var(--browser-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--browser-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);}

        /* === AVATAR HUB & DASHBOARD TOGGLE === */
        .avatar-hub { display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; background: none; border: none; cursor: pointer; padding: 10px; }
        .avatar-ring { width: 170px; height: 170px; border-radius: 50%; background: linear-gradient(135deg, var(--color-blue), var(--color-dark-blue)); display: flex; align-items: center; justify-content: center; font-size: 5rem; border: 5px solid var(--browser-bg); box-shadow: 0 15px 35px rgba(30,58,138,0.35); position: relative; animation: float 4s ease-in-out infinite; transition: transform 0.3s, box-shadow 0.3s; }
        .avatar-ring::after { content: ''; position: absolute; inset: -14px; border: 2px dashed rgba(100,116,139,0.55); border-radius: 50%; }
        .avatar-hub:hover .avatar-ring { transform: scale(1.08); box-shadow: 0 20px 45px rgba(30,58,138,0.5); }
        .avatar-hub:focus-visible .avatar-ring { outline: 3px solid var(--color-orange); outline-offset: 8px; }
        .portal-wrapper.open .avatar-hub { display: none; }
        .portal-wrapper.open .browser-window { display: flex; animation: popIn 0.35s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .dot.red { cursor: pointer; }
        .dot.red:hover { filter: brightness(0.85); }

        /* === KUNCI MENU GURU === */
        .lock-badge { position: absolute; bottom: -2px; right: -2px; width: 28px; height: 28px; border-radius: 50%; background: #1e293b; color: #fff; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; z-index: 6; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .avatar-ring .lock-badge { bottom: 8px; right: 8px; width: 44px; height: 44px; font-size: 1.3rem; border-width: 3px; }
        body.guru-mode .lock-badge { display: none; }
        .lock-toggle { display: none; background: var(--card-bg); border: 1px solid var(--browser-border); color: var(--text-main); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.3s; }
        .lock-toggle:hover { background: #ef4444; color: white; }
        body.guru-mode .lock-toggle { display: inline-block; }
        .sync-btn { display: none; }
        body.guru-mode .sync-btn { display: inline; }
        @media (max-width: 1099px) { .circle-icon .lock-badge { width: 20px; height: 20px; font-size: 0.6rem; border-width: 1px; } }

        .pin-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.65); z-index: 10000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(3px); }
        .pin-overlay.show { display: flex; }
        .pin-card { background: var(--browser-bg); color: var(--text-main); border: 1px solid var(--browser-border); border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.35); animation: popIn 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .pin-card h3 { color: var(--color-dark-blue); margin: 8px 0 6px; font-size: 1.25rem; }
        .pin-card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; line-height: 1.4; }
        .pin-card input { text-align: center; letter-spacing: 6px; font-size: 1.2rem; font-weight: bold; }
        .pin-error { color: #ef4444; font-size: 0.8rem; font-weight: 600; min-height: 20px; margin: 8px 0; }
        .pin-actions { display: flex; gap: 10px; }
        .pin-actions button { flex: 1; }
        .pin-card.shake { animation: shake 0.35s; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        /* === ORBIT DINAMIS (DESKTOP) === */
        .orbit-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: visible; }
        .orbit-svg path { fill: none; stroke: rgba(100,116,139,0.55); stroke-width: 2; stroke-dasharray: 8 8; stroke-linejoin: round; }
        @media (min-width: 1100px) {
            .portal-wrapper { height: 460px; }
            .menu-column { display: contents; }
            .menu-item { position: absolute; left: 0; top: 0; }
            .circle-icon { animation: none; }
        }

        /* Mobile */
        @media (max-width: 1099px) {
            .portal-wrapper { flex-direction: column; gap: 20px; padding-bottom: 100px; }
            .orbit-bg, .orbit-svg { display: none; }
            .browser-window { order: 1; width: 95%; min-height: 60vh; margin-top: 10px; }
            .menu-column { position: fixed; bottom: 0; left: 0; width: 100%; flex-direction: row; justify-content: space-around; background: var(--nav-bg-mobile); padding: 10px 5px 20px; border-top: 1px solid var(--browser-border); box-shadow: 0 -5px 15px rgba(0,0,0,0.1); margin: 0 !important; gap: 0; z-index: 1000; }
            .menu-column.left .menu-item:nth-child(1), .menu-column.left .menu-item:nth-child(2), .menu-column.right .menu-item:nth-child(1), .menu-column.right .menu-item:nth-child(2) { transform: none; }
            .circle-icon { width: 45px; height: 45px; font-size: 1.2rem; margin: 0 auto 5px; animation: none !important; }
            .circle-icon::after { display: none; } .menu-text { font-size: 0.65rem; }
        }
        .bg-jadwal { background-color: #14b8a6; } .bg-info { background-color: #ec4899; }
        .jadwal { font-size: 0.8rem; }
        .jadwal td:nth-child(2) { text-align: center; font-weight: 400; }
        .jadwal th.hari-ini { background: var(--color-blue); color: #fff; }
        .jadwal td.hari-ini { background: rgba(75,163,227,0.18); font-weight: 600; }

        @media (max-width: 1099px) {
            .menu-column.left { width: 66.667%; }
            .menu-column.right { left: 66.667%; width: 33.333%; }
            .menu-item { width: auto; flex: 1; min-width: 0; }
            .menu-text { font-size: 0.6rem; }
        }
        /* === TEMA EDUVERSE (semesta belajar) === */
        :root { --star: rgba(99,102,241,0.35); }
        body.dark-mode { --star: #ffffff; }
        body { background-image: linear-gradient(160deg, #e0f2fe 0%, #ede9fe 100%); background-attachment: fixed; }
        body.dark-mode { background-image: radial-gradient(ellipse at 20% 10%, rgba(99,102,241,0.28), transparent 55%), radial-gradient(ellipse at 85% 85%, rgba(168,85,247,0.22), transparent 50%), linear-gradient(180deg, #0b1026, #111a3a); }
        .bg-decor, body.dark-mode .bg-decor { opacity: 1; background-size: 250px 250px; background-image: radial-gradient(1.5px 1.5px at 20px 30px, var(--star), transparent), radial-gradient(1px 1px at 90px 140px, var(--star), transparent), radial-gradient(1.5px 1.5px at 160px 70px, var(--star), transparent), radial-gradient(1px 1px at 220px 200px, var(--star), transparent), radial-gradient(1px 1px at 50px 210px, var(--star), transparent); }
        h1 { background: linear-gradient(90deg, #4ba3e3, #8b5cf6, #f9a826); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 6px; filter: drop-shadow(0 0 12px rgba(139,92,246,0.35)); }
        .tagline { color: var(--text-muted); font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; margin-top: -4px; }
        .orbit-svg path { stroke: rgba(139,92,246,0.6); filter: drop-shadow(0 0 4px rgba(139,92,246,0.5)); }
        .avatar-ring { background: linear-gradient(135deg, #4ba3e3, #8b5cf6); box-shadow: 0 0 40px rgba(139,92,246,0.45), 0 15px 35px rgba(30,58,138,0.35); }
        .avatar-ring::after { border-color: rgba(139,92,246,0.55); }
        @media (max-width: 480px) { h1 { font-size: 2rem; letter-spacing: 3px; } }
        /* === IKON MENU BERTEMA SEMESTA === */
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo { width: 54px; height: 54px; filter: drop-shadow(0 0 10px rgba(139,92,246,0.5)); }
        .circle-icon { border: 2px solid rgba(255,255,255,0.5); box-shadow: 0 0 22px rgba(139,92,246,0.4), 0 10px 20px rgba(0,0,0,0.15); }
        .bg-mpi { background: linear-gradient(135deg, #4ba3e3, #6366f1); }
        .bg-jadwal { background: linear-gradient(135deg, #14b8a6, #0ea5e9); }
        .bg-info { background: linear-gradient(135deg, #ec4899, #a855f7); }
        .bg-absen { background: linear-gradient(135deg, #f9a826, #f97316); }
        .bg-jurnal { background: linear-gradient(135deg, #a855f7, #7c3aed); }
        .bg-nilai { background: linear-gradient(135deg, #fbc531, #f59e0b); }
        @media (max-width: 480px) { .logo { width: 36px; height: 36px; } }
        /* === GAME BELAJAR: TATA LETAK === */
        .bg-game { background: linear-gradient(135deg, #22c55e, #14b8a6); }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
        .game-card { border: 1px solid var(--browser-border); border-radius: 12px; padding: 16px; background: var(--card-bg); display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .game-card .ikon { font-size: 2rem; }
        .game-card .bintang { color: #f59e0b; letter-spacing: 2px; }
        .game-card button { margin-top: auto; }
        .game-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .game-progres { flex: 1; height: 10px; border-radius: 6px; background: var(--browser-border); overflow: hidden; }
        .game-progres > div { height: 100%; background: linear-gradient(90deg, #4ba3e3, #8b5cf6); transition: width 0.3s; }
        .game-soal { text-align: center; font-size: 1.6rem; font-weight: 700; padding: 28px 12px; margin: 10px 0 16px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--browser-border); }
        .game-opsi { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .game-opsi button { min-height: 56px; font-size: 1.1rem; font-weight: 700; border-radius: 12px; border: 2px solid var(--browser-border); background: var(--card-bg); color: var(--text-main); cursor: pointer; }
        .game-opsi button.benar { border-color: #16a34a; background: #dcfce7; color: #166534; }
        .game-opsi button.salah { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
        .portal-wrapper.fokus .orbit-svg, .portal-wrapper.fokus .menu-item, .portal-wrapper.fokus .menu-column { display: none !important; }
        .portal-wrapper.fokus .browser-window { width: 100%; max-width: 920px; min-height: 70vh; }
        body.fokus-game header { display: none; }
        @media (max-width: 360px) { .game-opsi { grid-template-columns: 1fr; } }
        @media (orientation: landscape) and (max-height: 500px) { .game-soal { padding: 12px; font-size: 1.2rem; margin: 6px 0 10px; } .game-opsi button { min-height: 48px; } }
        /* === ABSENSI === */
        .abs-row { padding: 10px 0; border-bottom: 1px solid var(--browser-border); }
        .abs-nama { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
        .abs-nama span { font-size: 0.75rem; color: var(--text-muted); }
        .abs-opsi { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .abs-btn { min-height: 48px; font-size: 1.3rem; line-height: 1; padding: 2px; font-weight: 700; border-radius: 10px; border: 2px solid var(--browser-border); background: var(--card-bg); color: var(--text-main); cursor: pointer; }
        .abs-btn:not(.aktif) { filter: grayscale(1); opacity: 0.65; }
        .abs-btn.aktif.Hadir { background: #dcfce7; border-color: #16a34a; color: #166534; }
        .abs-btn.aktif.Terlambat { background: #fef3c7; border-color: #d97706; color: #92400e; }
        .abs-btn.aktif.Sakit { background: #dbeafe; border-color: #2563eb; color: #1e40af; }
        .abs-btn.aktif.Izin { background: #ede9fe; border-color: #7c3aed; color: #5b21b6; }

        /* === DAFTAR NILAI === */

<body>
    <div class="bg-decor"></div>
    <header>

            <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="bodyEdu" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#93c5fd"/><stop offset="0.55" stop-color="#6366f1"/><stop offset="1" stop-color="#5b21b6"/></radialGradient></defs><g transform="rotate(-20 32 32)"><path d="M4 32A28 9 0 0 1 60 32" fill="none" stroke="#f9a826" stroke-width="3.5" stroke-linecap="round"/><circle cx="32" cy="32" r="15" fill="url(#bodyEdu)"/><path d="M4 32A28 9 0 0 0 60 32" fill="none" stroke="#f9a826" stroke-width="3.5" stroke-linecap="round"/></g><circle cx="54" cy="10" r="2.2" fill="#f9a826"/><circle cx="9" cy="54" r="1.6" fill="#8b5cf6"/></svg>

    <script>
        // === JAM & TEMA ===
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false }); }, 1000);
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            document.querySelector('.theme-toggle').innerText = document.body.classList.contains('dark-mode') ? '☀️ Mode Terang' : '🌙 Mode Gelap';
        }

        // === NOTIFIKASI & LOGIC KHUSUS ===
        function showToast(msg, isWarning = false) {
            const toast = document.getElementById('toast');
            toast.innerHTML = isWarning ? `⚠️ ${msg}` : `✅ ${msg}`;
            toast.className = `toast show ${isWarning ? 'warning' : ''}`;
            setTimeout(() => toast.classList.remove('show'), isWarning ? 5000 : 3000);
        }

        function laporAlpa(nama) {
            showToast(`Peringatan: ${nama} terdeteksi Alpa beruntun! Surat Panggilan Orang Tua otomatis di-draft.`, true);
        }

        function syncRPP() {
            document.getElementById('jurnal-topik').value = "Fungsi Kuadrat dan Grafiknya";
            document.getElementById('jurnal-catatan').value = "Pendekatan berdiferensiasi: siswa visual memakai GeoGebra, siswa auditori berdiskusi kelompok.";
            showToast("Berhasil mengambil data dari ATP/Modul Ajar!");
        }

        function switchJurnalTab(tabName) {
            document.getElementById('tab-intra').style.display = tabName === 'intra' ? 'block' : 'none';
            document.getElementById('tab-p5').style.display = tabName === 'p5' ? 'block' : 'none';
            document.getElementById('btn-intra').classList.toggle('active', tabName === 'intra');
            document.getElementById('btn-p5').classList.toggle('active', tabName === 'p5');
        }

        // Mock function untuk Export Excel
        function exportToExcel() {
            showToast("Menyiapkan file Rekap_Nilai_XMIPA1.xlsx...");
            setTimeout(() => {
                showToast("File Excel berhasil diunduh! Siap diunggah ke Rapor Digital.");
            }, 1500);
        }

        // === DATA KONTEN SPA ===
        const appData = {
            home: {
                url: "Dashboard / Beranda",
                getHtml: async () => {
                    const nama = window.guruNama || '';
                    let kls = '-', sis = '-', jam = '-';
                    if (sb) {
                        const hitung = (t) => sb.from(t).select('id', { count: 'exact', head: true });
                        const [a, b, c] = await Promise.all([hitung('kelas'), hitung('siswa'), hitung('jadwal')]);
                        kls = a.count ?? '-'; sis = b.count ?? '-'; jam = c.count ?? '-';
                    }
                    const stat = (v, label, warna) => `<div class="stat-box"><h2 style="color:${warna};">${v}</h2><p style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">${label}</p></div>`;
                    return `
                        <h2 class="view-title">Selamat Datang${nama ? ', ' + esc(nama.split(',')[0]) : ''} 👋</h2>
                        <div class="profile-container">
                            <div class="profile-avatar">👨‍🏫</div>
                            <div><h3 style="color: var(--color-dark-blue); font-size: 1.2rem;">${esc(nama || 'Guru Matematika')}</h3><p style="color: var(--text-muted); font-size: 0.9rem;">${nama ? 'Guru Matematika' : 'Atur nama Anda di Kelola Kelas &amp; Siswa'}</p></div>
                        </div>
                        <div class="stats-grid">
                            ${stat(kls, 'Kelas Diampu', 'var(--color-orange)')}
                            ${stat(sis, 'Siswa', 'var(--color-blue)')}
                            ${stat(jam, 'Jam Mengajar', '#16a34a')}
                        </div>
                        <button class="btn-submit" style="margin-top:16px;" onclick="loadContent('kelola')">⚙️ Kelola Kelas &amp; Siswa</button>
                    `;
                }
            },
            absen: {
                url: "Modul Guru / Absensi",
                getHtml: async () => {
                    const judul = '<h2 class="view-title">Absensi</h2>';
                    if (!sb) return judul + '<p style="color:var(--text-muted);">Absensi membutuhkan koneksi Supabase. Isi kunci <b>anon</b> di <code>index.html</code>, lalu buka dari GitHub Pages.</p>';
                    const st = (window.absenState = window.absenState || { tab: 'input' });
                    const hariIni = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
                    st.tanggal = st.tanggal || hariIni;
                    st.bulan = st.bulan || hariIni.slice(0, 7);
                    const kr = await sb.from('kelas').select('id, nama').order('nama');
                    if (kr.error) return judul + '<p style="color:#b91c1c;">Gagal memuat data. Periksa koneksi, lalu coba lagi.</p>';
                    if (!kr.data.length) return judul + '<p style="color:var(--text-muted);">Belum ada kelas. Tambahkan di Kelola Kelas &amp; Siswa.</p>';
                    if (!kr.data.some(k => k.id === st.kelasId)) st.kelasId = kr.data[0].id;
                    const sw = await sb.from('siswa').select('id, nis, nama').eq('kelas_id', st.kelasId).order('nama');
                    if (sw.error) return judul + '<p style="color:#b91c1c;">Gagal memuat siswa.</p>';
                    const siswa = sw.data, ids = siswa.map(x => x.id);
                    st.jumlah = siswa.length;
                    const opsiKelas = kr.data.map(k => `<option value="${k.id}" ${k.id === st.kelasId ? 'selected' : ''}>${esc(k.nama)}</option>`).join('');
                    const tabBtn = (k, label) => `<button class="btn-outline" style="${st.tab === k ? 'background:var(--color-blue); color:#fff; border-color:var(--color-blue);' : ''}" onclick="ubahAbsen('tab','${k}')">${label}</button>`;
                    const atas = `${judul}<div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">${tabBtn('input', '📝 Input Harian')}${tabBtn('rekap', '📊 Rekap Bulanan')}</div>`;
                    if (!siswa.length) return atas + '<p style="color:var(--text-muted);">Belum ada siswa di kelas ini. Tambahkan di Kelola Kelas &amp; Siswa.</p>';

                    if (st.tab === 'rekap') {
                        const [th, bl] = st.bulan.split('-').map(Number);
                        const akhir = new Date(th, bl, 0).getDate();
                        let semua = [], dari = 0;
                        while (true) {
                            const { data, error } = await sb.from('absensi').select('siswa_id, status').in('siswa_id', ids).gte('tanggal', st.bulan + '-01').lte('tanggal', st.bulan + '-' + String(akhir).padStart(2, '0')).range(dari, dari + 999);
                            if (error) return atas + '<p style="color:#b91c1c;">Gagal memuat rekap.</p>';
                            semua = semua.concat(data);
                            if (data.length < 1000) break;
                            dari += 1000;
                        }
                        const baris = siswa.map((x, i) => {
                            const c = { Hadir: 0, Terlambat: 0, Sakit: 0, Izin: 0, Alpa: 0 };
                            semua.filter(r => r.siswa_id === x.id).forEach(r => { if (c[r.status] !== undefined) c[r.status]++; });
                            const tot = c.Hadir + c.Terlambat + c.Sakit + c.Izin + c.Alpa;
                            const persen = tot ? Math.round((c.Hadir + c.Terlambat) / tot * 100) + '%' : '-';
                            return `<tr><td>${i + 1}</td><td>${esc(x.nama)}</td><td>${c.Hadir}</td><td>${c.Terlambat}</td><td>${c.Sakit}</td><td>${c.Izin}</td><td>${c.Alpa}</td><td>${persen}</td></tr>`;
                        }).join('');
                        return atas + `
                            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
                                <select onchange="ubahAbsen('kelasId', this.value)" style="flex:1; min-width:140px;">${opsiKelas}</select>
                                <input type="month" value="${st.bulan}" onchange="ubahAbsen('bulan', this.value)" style="flex:1; min-width:140px;">
                            </div>
                            <div style="overflow-x:auto;"><table><tr><th>No</th><th>Nama</th><th>Hadir</th><th>Terlambat</th><th>Sakit</th><th>Izin</th><th>Alpa</th><th>% Hadir</th></tr>${baris}</table></div>
                            <p style="font-size:0.75rem; color:var(--text-muted); margin-top:8px;">% Hadir = (Hadir + Terlambat) dibagi jumlah hari yang tercatat (termasuk Alpa).</p>`;
                    }

                    const ab = await sb.from('absensi').select('siswa_id, status, catatan').eq('tanggal', st.tanggal).in('siswa_id', ids);
                    if (ab.error) return atas + '<p style="color:#b91c1c;">Gagal memuat absensi.</p>';
                    st.data = {}; st.tersimpan = new Set();
                    ab.data.forEach(r => { st.data[r.siswa_id] = { s: r.status, c: r.catatan || '' }; st.tersimpan.add(r.siswa_id); });
                    const baris = siswa.map((x, i) => {
                        const cur = st.data[x.id];
                        return `<div class="abs-row" id="ar-${x.id}">
                            <div class="abs-nama"><strong>${i + 1}. ${esc(x.nama)}</strong><span>${esc(x.nis)}</span></div>
                            <div class="abs-opsi">${ABSEN_STATUS.map(([n, ik]) => `<button class="abs-btn ${cur && cur.s === n ? 'aktif ' + n : ''}" data-s="${n}" title="${n}" aria-label="${n}" onclick="setAbsen('${x.id}','${n}')">${ik}</button>`).join('')}</div>
                            <input class="abs-cat" id="ac-${x.id}" placeholder="Keterangan (opsional)" value="${esc(cur ? cur.c : '')}" oninput="absenCatatan('${x.id}', this.value)" style="display:${cur && cur.s !== 'Hadir' ? 'block' : 'none'};">
                        </div>`;
                    }).join('');
                    return atas + `
                        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
                            <input type="date" value="${st.tanggal}" onchange="ubahAbsen('tanggal', this.value)" style="flex:1; min-width:140px;">
                            <select onchange="ubahAbsen('kelasId', this.value)" style="flex:1; min-width:140px;">${opsiKelas}</select>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
                            <div id="abs-ringkas"></div>
                            <button class="btn-outline" onclick="semuaHadir()">✔ Semua Hadir</button>
                        </div>
                        ${baris}
                        <button class="btn-submit" style="margin-top:12px;" onclick="simpanAbsensi()">Simpan Absensi</button>
                    `;
                }
            },
            jurnal: {
                url: "Modul Guru / Daily Journal",
                getHtml: async () => {
                    let opsiKelas = '<option value="">Matematika - X-1</option>';
                    if (sb) {
                        const { data } = await sb.from('kelas').select('id, nama').order('nama');
                        opsiKelas = (data && data.length) ? data.map(k => `<option value="${k.id}">Matematika - ${esc(k.nama)}</option>`).join('') : '<option value="">Belum ada kelas (tambah di Kelola Kelas)</option>';
                    }
                    const hariIni = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
                    const kotak = 'padding:14px; border:1px solid var(--browser-border); border-radius:8px; margin-bottom:14px; background:var(--card-bg);';
                    const h3 = 'color:var(--color-dark-blue); font-size:1rem; margin-bottom:10px;';
                    return `
                        <h2 class="view-title">Daily Journal</h2>
                        <div class="form-group" style="display:flex; gap:10px; flex-wrap:wrap;">
                            <div style="flex:1; min-width:140px;"><label>Tanggal</label><input type="date" id="jurnal-tanggal" value="${hariIni}"></div>
                            <div style="flex:2; min-width:180px;"><label>Mata Pelajaran & Kelas</label><select id="jurnal-kelas">${opsiKelas}</select></div>
                        </div>
                        <div style="${kotak}">
                            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px;">
                                <h3 style="${h3} margin-bottom:0;">📘 Intrakurikuler</h3>
                                <button class="btn-outline" onclick="syncRPP()">🔄 Ambil dari ATP/Modul</button>
                            </div>
                            <div class="form-group"><label>Materi / Tujuan Pembelajaran</label><input type="text" id="jurnal-topik" placeholder="Otomatis terisi jika klik tombol Ambil dari ATP/Modul..."></div>
                            <div class="form-group" style="margin-bottom:0;"><label>Kegiatan Pembelajaran</label><textarea id="jurnal-kegiatan" rows="2"></textarea></div>
                        </div>
                        <div style="${kotak}">
                            <h3 style="${h3}">🌱 Kokurikuler</h3>
                            <div class="form-group" style="margin-bottom:0;"><label>Kegiatan Kokurikuler (jika ada)</label><textarea id="jurnal-koku" rows="2"></textarea></div>
                        </div>
                        <div class="form-group"><label>Catatan & Refleksi</label><textarea id="jurnal-catatan" rows="3" placeholder="Evaluasi, catatan diferensiasi, tindak lanjut..."></textarea></div>
                        <button class="btn-submit" onclick="simpanJurnal()">Simpan Jurnal</button>
                    `;
                }
            },
            nilai: {
                url: "Modul Asesmen / Daftar Nilai",
                getHtml: async () => {
                    const judul = '<h2 class="view-title">Daftar Nilai</h2>';
                    if (!sb) return judul + '<p style="color:var(--text-muted);">Daftar Nilai membutuhkan koneksi Supabase. Isi kunci <b>anon</b> di <code>index.html</code>, lalu buka dari GitHub Pages.</p>';
                    const st = (window.nilaiState = window.nilaiState || { tab: 'input' });
                    const kr = await sb.from('kelas').select('id, nama').order('nama');
                    if (kr.error) return judul + '<p style="color:#b91c1c;">Gagal memuat data. Periksa koneksi, lalu coba lagi.</p>';
                    if (!kr.data.length) return judul + '<p style="color:var(--text-muted);">Belum ada kelas. Tambahkan di Kelola Kelas &amp; Siswa.</p>';
                    if (!kr.data.some(k => k.id === st.kelasId)) st.kelasId = kr.data[0].id;
                    let d;
                    st.semester = st.semester || semesterSaatIni();
                    try { d = await muatNilai(st.kelasId, st.semester); } catch (e) { return judul + '<p style="color:#b91c1c;">Gagal memuat nilai. Pastikan supabase_patch_4.sql sudah dijalankan.</p>'; }
                    window.nilaiD = d;
                    const opsiKelas = kr.data.map(k => `<option value="${k.id}" ${k.id === st.kelasId ? 'selected' : ''}>${esc(k.nama)}</option>`).join('');
                    if (!d.materi.length) return judul + `<select onchange="ubahNilai('kelasId', this.value)" style="margin-bottom:12px;">${opsiKelas}</select><select onchange="ubahNilai('semester', this.value)" style="margin:0 0 12px 8px;">${semesterOpsi(st.semester)}</select><p style="color:var(--text-muted);">Belum ada materi pada semester ini. Atur Materi &amp; TP di menu Modul (MPI), tab Materi &amp; TP.</p>`;
                    if (!d.materi.some(m => m.id === st.materiId)) st.materiId = d.materi[0].id;
                    const m = d.materi.find(x => x.id === st.materiId);
                    const tabBtn = (k, label) => `<button class="btn-outline" style="${st.tab === k ? 'background:var(--color-blue); color:#fff; border-color:var(--color-blue);' : ''}" onclick="ubahNilai('tab','${k}')">${label}</button>`;
                    const atas = `${judul}<div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">${tabBtn('input', '📝 Input Nilai')}${tabBtn('rekap', '📊 Rekap Gabungan')}</div>`;
                    if (st.tab === 'rekap') {
                        const hit = {};
                        d.materi.forEach(mm => { hit[mm.id] = { Istimewa: 0, Baik: 0, Cukup: 0, Kurang: 0, total: 0 }; d.siswa.forEach(x => { const p = tampilNilai(d, mm.id, x.id).pred; if (p) { hit[mm.id][p]++; hit[mm.id].total++; } }); });

        function bacaExcel(input) {
            const f = input.files[0];
            if (!f) return;
            if (typeof XLSX === 'undefined') { showToast('Pustaka Excel belum termuat. Periksa koneksi internet.', true); return; }
            const box = document.getElementById('sw-excel-preview');
            const rd = new FileReader();
            rd.onload = (e) => {
                try {
                    const wb = XLSX.read(e.target.result, { type: 'array' });
                    let baris = [];
                    for (const nm of wb.SheetNames) {
                        const b = XLSX.utils.sheet_to_json(wb.Sheets[nm], { header: 1, defval: '', raw: false });
                        if (b.some(r => r.some(c => /^(nis|nisn|no[. ]*induk)$/i.test(String(c).trim())) && r.some(c => /^nama/i.test(String(c).trim())))) { baris = b; break; }
                        if (!baris.length) baris = b;
                    }
                    const isNis = (c) => /^(nis|nisn|no[. ]*induk)$/i.test(String(c).trim());
                    const isNama = (c) => /^nama/i.test(String(c).trim());
                    let iNis = 0, iNama = 1, mulai = 0;
                    const h = baris.findIndex(r => r.some(isNis) && r.some(isNama));
                    if (h >= 0) { iNis = baris[h].findIndex(isNis); iNama = baris[h].findIndex(isNama); mulai = h + 1; }
                    const peta = new Map();
                    let lewat = 0, dobel = 0;
                    baris.slice(mulai).forEach(r => {
                        const nis = String(r[iNis] ?? '').trim();
                        const nama = String(r[iNama] ?? '').trim();
                        if (!nis && !nama) return;
                        if (!nis || !nama) { lewat++; return; }
                        if (peta.has(nis)) dobel++;
                        peta.set(nis, nama);
                    });
                    const rows = Array.from(peta, ([nis, nama]) => ({ nis, nama }));
                    window.excelSiswa = rows;
                    if (!rows.length) { box.innerHTML = '<p style="color:#b91c1c; font-size:0.85rem; margin-top:8px;">Tidak ada data siswa yang terbaca. Pastikan ada kolom NIS dan Nama.</p>'; return; }
                    const prev = rows.slice(0, 5).map(r => `<tr><td>${esc(r.nis)}</td><td>${esc(r.nama)}</td></tr>`).join('');
                    box.innerHTML = `<p style="margin:10px 0 6px; font-size:0.85rem;"><strong>${rows.length}</strong> siswa terbaca${lewat ? ', ' + lewat + ' baris dilewati (NIS atau nama kosong)' : ''}${dobel ? ', ' + dobel + ' NIS ganda digabung' : ''}.</p><table><tr><th>NIS</th><th>Nama</th></tr>${prev}</table>${rows.length > 5 ? '<p style="font-size:0.75rem; color:var(--text-muted);">…dan ' + (rows.length - 5) + ' lainnya</p>' : ''}<button class="btn-submit" style="margin-top:8px;" onclick="konfirmasiExcel()">Impor ${rows.length} Siswa ke Kelas Ini</button>`;
                } catch (err) {
                    showToast('File tidak dapat dibaca: ' + err.message, true);
                }
            };
            rd.readAsArrayBuffer(f);
        }

        async function muatNilai(kelasId, semester) {
            const [kr, mt, sw] = await Promise.all([
                sb.from('kelas').select('id, nama, tahun_ajaran, wali_kelas').eq('id', kelasId).maybeSingle(),

                sb.from('siswa').select('id, nis, nama').eq('kelas_id', kelasId).order('nama')
            ]);
            if (kr.error || mt.error || sw.error) throw new Error('gagal memuat');
            const materi = mt.data, siswa = sw.data, mids = materi.map(m => m.id), sids = siswa.map(x => x.id);
            const d = { kelas: kr.data || {}, semester, materi, siswa, tp: {}, f: {}, s: {}, hadir: {} };
            if (!mids.length) return d;
            const tps = await ambilSemua(() => sb.from('tp').select('id, materi_id, urutan, deskripsi').in('materi_id', mids).order('urutan'));
            materi.forEach(m => { d.tp[m.id] = tps.filter(t => t.materi_id === m.id); });
            if (!sids.length) return d;
            const tpIds = tps.map(t => t.id);
            const [fs, ss] = await Promise.all([
                tpIds.length ? ambilSemua(() => sb.from('nilai_formatif').select('siswa_id, tp_id, predikat').in('tp_id', tpIds)) : [],
                ambilSemua(() => sb.from('nilai_sumatif').select('siswa_id, materi_id, skor').in('materi_id', mids))
            ]);
            fs.forEach(r => { d.f[r.siswa_id + '|' + r.tp_id] = r.predikat; });
            ss.forEach(r => { d.s[r.siswa_id + '|' + r.materi_id] = Number(r.skor); });
            await Promise.all(materi.map(async m => {
                if (!m.tanggal_mulai || !m.tanggal_selesai) { d.hadir[m.id] = null; return; }
                const rows = await ambilSemua(() => sb.from('absensi').select('siswa_id, tanggal, status').in('siswa_id', sids).gte('tanggal', m.tanggal_mulai).lte('tanggal', m.tanggal_selesai));
                const per = {};

        function tampilNilai(d, mid, sid) {
            const poin = { IST: 100, BAIK: 90, PB: 75 };
            const isi = (d.tp[mid] || []).map(t => d.f[sid + '|' + t.id]).filter(Boolean);
            const skorF = isi.length ? isi.reduce((a, p) => a + poin[p], 0) / isi.length : null;
            const sv = d.s[sid + '|' + mid];
            const sum = (sv === undefined || isNaN(sv)) ? null : sv;
            const h = d.hadir[mid];
            const hadir = h ? (h.per[sid] || 0) : null, efektif = h ? h.efektif : null;
            const persen = (h && h.efektif > 0) ? hadir / h.efektif : null;
            const akhir = (skorF !== null && sum !== null && persen !== null) ? skorF * 0.4 + sum * 0.4 + persen * 100 * 0.2 : null;
            const pred = akhir === null ? '' : akhir >= 90 ? 'Istimewa' : akhir >= 75 ? 'Baik' : akhir >= 60 ? 'Cukup' : 'Kurang';

                    judul(3, `Bobot: Formatif (${n} indikator) 40% | Sumatif 40% | Kehadiran 20% | Formatif: Istimewa=100, Baik=90, PB=75 | Predikat: Istimewa ≥ 90, Baik 75–89, Cukup 60–74, Kurang < 60`, 9, false);
                    ws.getRow(2).height = 30; ws.getRow(3).height = 28;
                    const grup = (a, b, teks, warna) => { if (a !== b) ws.mergeCells(`${a}4:${b}4`); const c = ws.getCell(`${a}4`); c.value = teks; kepala(c, warna); };
                    grup('A', 'C', 'IDENTITAS PESERTA DIDIK', 'FF1E3A8A');
                    grup('D', capL, `PENILAIAN FORMATIF (${o.tps.length} TP) — IST | BAIK | PB`, 'FF0F766E');
                    grup(sumL, sumL, 'SUMATIF', 'FF7C3AED');
                    grup(L(6 + n), L(8 + n), 'KEHADIRAN', 'FFB45309');
                    grup(akhirL, predL, 'REKAP AKHIR', 'FF1E3A8A');
                    const kep = ['No', 'NIS', 'Nama Peserta Didik', ...Array.from({ length: n }, (_, j) => 'F' + (j + 1)), 'Skor Formatif (Rata²)', '% Capaian Formatif', 'Nilai Sumatif (0–100)', 'Jml Hari Hadir', 'Total Hari Efektif', '% Kehadiran', 'Skor Akhir', 'PREDIKAT TKA'];
                    kep.forEach((t, i) => { const c = ws.getCell(5, i + 1); c.value = t; kepala(c, 'FF334155'); });
                    ws.getRow(5).height = 42;
                    for (let i = 0; i < o.baris; i++) {
                        const r = 6 + i, sis = d.siswa[i], nl = sis ? tampilNilai(d, o.m.id, sis.id) : null, row = ws.getRow(r);
                        row.getCell(1).value = i + 1;
                        if (sis) { row.getCell(2).value = String(sis.nis); row.getCell(3).value = sis.nama; }
                        for (let j = 0; j < n; j++) {
                            const t = o.tps[j], v = (sis && t) ? d.f[sis.id + '|' + t.id] : undefined, c = row.getCell(4 + j);
                            if (v) c.value = v;
                            c.dataValidation = { type: 'list', allowBlank: true, formulae: ['"IST,BAIK,PB"'] };
                        }
                        const rng = `${L(3)}${r}:${L(2 + n)}${r}`;
                        const kosong = (v) => v == null ? '' : v;
                        row.getCell(4 + n).value = { formula: `IFERROR((COUNTIF(${rng},"IST")*100+COUNTIF(${rng},"BAIK")*90+COUNTIF(${rng},"PB")*75)/COUNTA(${rng}),"")`, result: kosong(nl && nl.skorF) };
                        row.getCell(5 + n).value = { formula: `IFERROR(${L(3 + n)}${r}/100,"")`, result: nl && nl.skorF != null ? nl.skorF / 100 : '' };
                        if (nl && nl.sum != null) row.getCell(6 + n).value = nl.sum;
                        if (nl && nl.hadir != null) { row.getCell(7 + n).value = nl.hadir; row.getCell(8 + n).value = nl.efektif; }
                        row.getCell(9 + n).value = { formula: `IFERROR(${L(6 + n)}${r}/${L(7 + n)}${r},"")`, result: kosong(nl && nl.persen) };
                        row.getCell(10 + n).value = { formula: `IFERROR(IF(AND(ISNUMBER(${sumL}${r}),ISNUMBER(${persL}${r})),${capL}${r}*100*0.4+${sumL}${r}*0.4+${persL}${r}*100*0.2,""),"")`, result: kosong(nl && nl.akhir) };
                        row.getCell(11 + n).value = { formula: `IFERROR(IF(ISNUMBER(${akhirL}${r}),IF(${akhirL}${r}>=90,"Istimewa",IF(${akhirL}${r}>=75,"Baik",IF(${akhirL}${r}>=60,"Cukup","Kurang"))),""),"")`, result: (nl && nl.pred) || '' };
                        row.getCell(4 + n).numFmt = '0.0'; row.getCell(5 + n).numFmt = '0.0%'; row.getCell(9 + n).numFmt = '0%'; row.getCell(10 + n).numFmt = '0.0';
                        for (let c = 1; c <= 11 + n; c++) { const cell = row.getCell(c); cell.border = tepi; if (c !== 3) cell.alignment = { horizontal: 'center', vertical: 'middle' }; }
                    }
                    ws.addConditionalFormatting({ ref: `${predL}6:${predL}${5 + o.baris}`, rules: Object.entries(warnaPred).map(([p, [bg, fg]]) => ({ type: 'cellIs', operator: 'equal', formulae: [`"${p}"`], style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: bg } }, font: { color: { argb: fg }, bold: true } } })) });
                    ws.getColumn(1).width = 5; ws.getColumn(2).width = 12; ws.getColumn(3).width = 34;
                    for (let c = 4; c <= 11 + n; c++) ws.getColumn(c).width = c < 4 + n ? 7 : 13;
                    ws.getColumn(11 + n).width = 14;
                    ws.views = [{ state: 'frozen', xSplit: 3, ySplit: 5 }];
                    const cat = 6 + o.baris; ws.mergeCells(`A${cat}:${lastL}${cat}`);
                    ws.getCell(`A${cat}`).value = 'Dihasilkan dari EDUVERSE pada ' + new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) + '. Kolom skor dihitung otomatis dengan rumus.';
                    ws.getCell(`A${cat}`).font = { italic: true, size: 9 };
                });

                // Rekap Gabungan
                const M = info.length, tot = 1 + M;
                wsRekap.mergeCells(`A1:${L(3 + M)}1`);
                wsRekap.getCell('A1').value = `REKAP GABUNGAN PREDIKAT TKA — ${k.nama} • SEMESTER ${d.semester.toUpperCase()}`;
                wsRekap.getCell('A1').font = { bold: true, size: 14 };
                ['Predikat', ...info.map(o => o.m.nama + ' (Jml)'), 'Total Siswa', 'Keterangan Capaian', 'Rentang Skor'].forEach((t, i) => { const c = wsRekap.getCell(2, i + 1); c.value = t; kepala(c, 'FF1E3A8A'); });
                const ket = { Istimewa: ['Melampaui capaian pembelajaran secara konsisten.', '≥ 90'], Baik: ['Mencapai tujuan pembelajaran sesuai harapan.', '75–89'], Cukup: ['Menunjukkan kemajuan namun perlu bimbingan.', '60–74'], Kurang: ['Memerlukan pendampingan intensif dari pendidik.', '< 60'] };
                Object.keys(warnaPred).forEach((p, pi) => {
                    const r = 3 + pi; wsRekap.getCell(r, 1).value = p;
                    wsRekap.getCell(r, 1).fill = isi(warnaPred[p][0]); wsRekap.getCell(r, 1).font = { bold: true, color: { argb: warnaPred[p][1] } };
                    info.forEach((o, i) => {
                        const jml = d.siswa.filter(x => tampilNilai(d, o.m.id, x.id).pred === p).length;
                        wsRekap.getCell(r, 2 + i).value = { formula: `COUNTIF('${o.sn.replace(/'/g, "''")}'!${o.predL}6:${o.predL}${5 + o.baris},"${p}")`, result: jml };
                    });
                    wsRekap.getCell(r, tot + 1).value = { formula: `SUM(B${r}:${L(tot - 1 + 0)}${r})`, result: info.reduce((a, o) => a + d.siswa.filter(x => tampilNilai(d, o.m.id, x.id).pred === p).length, 0) };
                    wsRekap.getCell(r, tot + 2).value = ket[p][0]; wsRekap.getCell(r, tot + 3).value = ket[p][1];
                });
                const rt = 7; wsRekap.getCell(rt, 1).value = 'TOTAL SISWA DINILAI'; wsRekap.getCell(rt, 1).font = { bold: true };
                for (let c = 2; c <= tot + 1; c++) {
                    const hasil = Object.keys(warnaPred).reduce((a, _, pi) => a + (Number((wsRekap.getCell(3 + pi, c).value || {}).result) || 0), 0);
                    wsRekap.getCell(rt, c).value = { formula: `SUM(${L(c - 1)}3:${L(c - 1)}6)`, result: hasil }; wsRekap.getCell(rt, c).font = { bold: true };
                }
                for (let r = 3; r <= rt; r++) for (let c = 1; c <= tot + 3; c++) { const cell = wsRekap.getCell(r, c); cell.border = tepi; if (c > 1 && c <= tot + 1) cell.alignment = { horizontal: 'center' }; }
                wsRekap.getColumn(1).width = 24; for (let c = 2; c <= tot + 1; c++) wsRekap.getColumn(c).width = 20; wsRekap.getColumn(tot + 2).width = 48; wsRekap.getColumn(tot + 3).width = 14;

                // Panduan
                const baris = ['PANDUAN PENGGUNAAN — DAFTAR NILAI FORMAT TKA', '', 'ISI WORKBOOK', ...info.map((o, i) => `  Sheet ${i + 3}: ${o.sn} — ${o.tps.length} Formatif (TP) + 1 Sumatif`), '  Sheet 1: Rekap Gabungan — distribusi predikat semua materi', '', 'KOMPONEN & BOBOT', '  Formatif 40%: setiap TP diisi IST (100), BAIK (90), atau PB (75)', '  Sumatif 40%: satu nilai skala 0–100 per materi', '  Kehadiran 20%: (Hadir + Terlambat) ÷ hari absensi tercatat pada periode materi', '', 'RUMUS', '  Skor Formatif = (Jml IST×100 + Jml BAIK×90 + Jml PB×75) ÷ Jml TP terisi', '  Skor Akhir = Capaian Formatif×40% + Sumatif×40% + % Kehadiran×20%', '', 'PREDIKAT TKA', '  Istimewa ≥ 90 | Baik 75–89 | Cukup 60–74 | Kurang < 60', '', 'Nilai dapat diubah langsung di Excel; Skor Akhir dan Predikat terhitung ulang otomatis.'];
                baris.forEach((t, i) => { const c = wsPan.getCell(i + 1, 1); c.value = t; if (i === 0 || ['ISI WORKBOOK', 'KOMPONEN & BOBOT', 'RUMUS', 'PREDIKAT TKA'].includes(t)) c.font = { bold: true, size: i === 0 ? 14 : 11 }; });
                wsPan.getColumn(1).width = 110;

                const buf = await wb.xlsx.writeBuffer();
                const url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
                const a = document.createElement('a'); a.href = url; a.download = ('Daftar_Nilai_' + k.nama + '_' + d.semester).replace(/[^\w-]+/g, '_') + '.xlsx';
                document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
                showToast('Workbook diunduh.');
            } catch (e) { console.error(e); showToast('Gagal membuat workbook: ' + e.message, true); }
        }

        // === ORBIT DINAMIS: garis mengikuti gerak ikon, mengembang/mengecil saat dashboard buka/tutup ===
        const orbitMQ = window.matchMedia('(min-width: 1100px)');
        const calmMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
        const portalWrap = document.querySelector('.portal-wrapper');
        const orbitPath = document.getElementById('orbit-path');
        const orbitItems = Array.from(document.querySelectorAll('.menu-item'));
        const orbitBase = orbitItems.map(el => (parseFloat(el.dataset.angle) || 0) * Math.PI / 180); // sudut tiap ikon dari atribut data-angle
        const orbitState = { rx: 300, ry: 250, h: 550, cleared: false };

        function orbitOffset(theta, thetas, bobs) {
            let d = 0;
            for (let i = 0; i < thetas.length; i++) {
                let diff = Math.abs(theta - thetas[i]) % (2 * Math.PI);
                if (diff > Math.PI) diff = 2 * Math.PI - diff;
                if (diff < Math.PI / 3) d += bobs[i] * 0.5 * (1 + Math.cos(3 * diff));
            }
            return d;
        }

        function orbitTick(ms) {
            const s = orbitState;
            if (orbitMQ.matches) {
                s.cleared = false;
                const t = ms / 1000, k = calmMQ.matches ? 0 : 1;
                const open = portalWrap.classList.contains('open');
                const win = portalWrap.querySelector('.browser-window');
                const W = portalWrap.clientWidth;
                const tRx = open ? Math.min(540, W / 2 - 70) : Math.min(300, W / 2 - 90);
                const tRy = open ? Math.max(300, win.offsetHeight / 2 + 50) : 250;
                const tH = portalWrap.classList.contains('fokus') ? win.offsetHeight + 60 : 2 * (tRy + 25);
                s.rx += (tRx - s.rx) * 0.07;
                s.ry += (tRy - s.ry) * 0.07;
                s.h += (tH - s.h) * 0.07;
                portalWrap.style.height = s.h + 'px';
                const cx = W / 2, cy = s.h / 2;
                const thetas = orbitBase.map((b, i) => b + k * 0.05 * Math.sin(t * 0.45 + i * 1.7));
                const bobs = orbitBase.map((_, i) => k * 9 * Math.sin(t * 0.8 + i * 2.1));
                const pt = th => {
                    const d = orbitOffset(th, thetas, bobs);
                    return [cx + (s.rx + d) * Math.cos(th), cy + (s.ry + d) * Math.sin(th)];
                };
                orbitItems.forEach((el, i) => {
                    const [x, y] = pt(thetas[i]);
                    el.style.left = (x - 60) + 'px';
                    el.style.top = (y - 45) + 'px';
                });
                let d = ''; const N = 180;
                for (let j = 0; j < N; j++) {
                    const [x, y] = pt(j / N * 2 * Math.PI);
                    d += (j ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
                }
                orbitPath.setAttribute('d', d + 'Z');
            } else if (!s.cleared) {
                s.cleared = true;
                portalWrap.style.height = '';
                orbitItems.forEach(el => { el.style.left = ''; el.style.top = ''; });
                orbitPath.removeAttribute('d');
            }
            requestAnimationFrame(orbitTick);
        }
        requestAnimationFrame(orbitTick);

        window.onload = () => {
            if(localStorage.getItem('theme') === 'dark') toggleTheme();
            applyGuruMode(); // Dashboard tertutup saat awal; hanya avatar & menu yang terlihat
        }
    </script>
</body>
</html>
